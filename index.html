<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="description" content="Offerte dei negozi partner Awin selezionate da Scala dei Turchi.">
  <title>Scala dei Turchi | Offerte Awin</title>
  <link rel="stylesheet" href="./stile.css?v=4">
  <script src="./catalogo.js?v=7" defer></script>
</head>
<body>
  <header id="inizio" tabindex="-1"><span>SCALA DEI TURCHI</span><h1>Offerte da scoprire, con un tocco di Sicilia.</h1><p>Confronta le offerte dei negozi partner.</p></header>
  <main>
    <div class="filtri">
      <label>Cerca prodotto o marca <input id="cerca" type="search" maxlength="120"></label>
      <label>Categoria <select id="categoria"><option value="">Tutte le categorie</option></select></label>
      <label>Venditore <select id="venditore" disabled><option value="">Tutti i venditori</option></select></label>
    </div>
    <div class="filtri filtri-offerte" aria-label="Filtri delle offerte">
      <label>Prezzo minimo (€) <input id="prezzo-minimo" type="number" min="0" step="0.01" inputmode="decimal" placeholder="Nessun minimo"></label>
      <label>Prezzo massimo (€) <input id="prezzo-massimo" type="number" min="0" step="0.01" inputmode="decimal" placeholder="Nessun massimo"></label>
      <label>Ordinamento <select id="ordinamento">
        <option value="">Sconti maggiori, poi prezzo crescente</option>
        <option value="name">Nome (A–Z)</option>
        <option value="price-asc">Prezzo crescente</option>
        <option value="price-desc">Prezzo decrescente</option>
      </select></label>
      <button id="solo-sconti" type="button" aria-pressed="false">Solo sconti</button>
    </div>
    <p id="stato" role="status">Caricamento del catalogo…</p>
    <div id="offerte" class="offerte"></div>
    <div class="azioni-catalogo">
      <button id="altre" type="button" hidden>Mostra altre offerte</button>
      <a class="torna-inizio" href="#inizio">Torna all’inizio</a>
    </div>
  </main>
  <footer>I link sono affiliati: Scala dei Turchi può ricevere una commissione. Prezzi e disponibilità vanno confermati sul sito del negozio. <a href="./privacy.html">Privacy</a> · <a href="./cookie.html">Cookie</a></footer>
</body>
</html>
